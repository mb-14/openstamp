# Alpaca instruction fine-tuning (1 epoch, response-only SFT).
# Effective batch 128 on 1 GPU: per_device 8 × grad_accum 16.
ft_dataset: alpaca
max_length: 512
completion_only_loss: true
num_train_epochs: 1
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 16
save_strategy: epoch
dtype: bfloat16
attn_implementation: sdpa
bf16: true
dataloader_num_workers: 4
dataloader_pin_memory: true
gradient_checkpointing: false
do_train: true
report_to: wandb
warmup_ratio: 0.1
learning_rate: 2.0e-5
dataset_num_proc: 8
lr_scheduler_type: cosine
optim: adafactor
loss_type: nll
